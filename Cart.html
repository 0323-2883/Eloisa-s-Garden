<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eloisa's Cart</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:linear-gradient(to right,#e8f5e9,#f1f8e9);
    padding:30px;
    color:#2e7d32;
}

/* HEADER */
.cart-header{
    text-align:center;
    margin-bottom:30px;
}

.cart-header h1{
    font-size:42px;
    margin-bottom:10px;
}

.cart-header p{
    color:#555;
    font-size:16px;
}

/* CART CONTAINER */
.cart-container{
    max-width:1100px;
    margin:auto;
    display:grid;
    grid-template-columns:2fr 1fr;
    gap:25px;
}

/* CART ITEMS */
.cart-items{
    background:white;
    padding:25px;
    border-radius:20px;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

.item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:18px;
    border-radius:15px;
    background:#f9fff9;
    margin-bottom:15px;
    transition:0.3s;
    border:1px solid #dcedc8;
}

.item:hover{
    transform:translateY(-3px);
    box-shadow:0 5px 12px rgba(0,0,0,0.08);
}

.item-name{
    font-size:18px;
    font-weight:bold;
}

.item-price{
    color:#666;
    margin-top:5px;
}

.actions button{
    border:none;
    padding:8px 14px;
    margin:0 4px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
    transition:0.3s;
}

.minus{
    background:#ffccbc;
}

.plus{
    background:#c8e6c9;
}

.remove{
    background:#ffcdd2;
}

.actions button:hover{
    opacity:0.8;
}

/* SUMMARY */
.summary{
    background:white;
    padding:25px;
    border-radius:20px;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
    height:fit-content;
}

.summary h2{
    margin-bottom:20px;
    color:#1b5e20;
}

.total{
    font-size:28px;
    font-weight:bold;
    margin:20px 0;
    color:#2e7d32;
}

.time-box{
    background:#f1f8e9;
    padding:10px;
    border-radius:10px;
    margin-bottom:20px;
    color:#555;
}

/* CHECKOUT */
.checkout{
    margin-top:15px;
}

.checkout input,
.checkout select{
    width:100%;
    padding:12px;
    border-radius:10px;
    border:1px solid #ccc;
    margin:10px 0;
    font-size:15px;
}

.payment-method{
    margin:15px 0;
}

.payment-method label{
    display:block;
    margin:10px 0;
    cursor:pointer;
}

/* PAYMENT BOXES */
.payment-box{
    display:none;
    background:#f9fff9;
    border:1px dashed #81c784;
    padding:18px;
    border-radius:15px;
    margin-top:15px;
}

/* GCASH BOX */
#gcashBox{
    text-align:center;
}

#gcashBox img{
    width:220px;
    border-radius:12px;
    margin:10px 0;
}

/* BANK BOX */
.bank-card{
    background:white;
    border-radius:15px;
    padding:15px;
    margin-top:12px;
    border:1px solid #dcedc8;
}

.bank-info{
    margin-top:10px;
    color:#444;
    line-height:1.8;
    font-size:15px;
}

.bank-note{
    font-size:13px;
    color:#777;
    margin-top:8px;
}

/* PREVIEW */
#previewImg,
#bankPreview{
    width:220px;
    border-radius:12px;
    margin-top:10px;
    display:none;
}

/* BUTTON */
.place-order{
    width:100%;
    padding:14px;
    border:none;
    background:linear-gradient(90deg,#43a047,#2e7d32);
    color:white;
    font-size:17px;
    border-radius:12px;
    cursor:pointer;
    margin-top:20px;
    transition:0.3s;
}

.place-order:hover{
    transform:scale(1.02);
}

/* EMPTY CART */
.empty{
    text-align:center;
    padding:40px;
    color:#777;
}

/* MOBILE */
@media(max-width:900px){

    .cart-container{
        grid-template-columns:1fr;
    }

    body{
        padding:15px;
    }

    .cart-header h1{
        font-size:32px;
    }
}
</style>
</head>

<body>

<div class="cart-header">
    <h1>🛒 Your Shopping Cart</h1>
    <p>Review your selected plants before checkout</p>
</div>

<div class="cart-container">

    <!-- LEFT -->
    <div class="cart-items">
        <div id="cartBox"></div>
    </div>

    <!-- RIGHT -->
    <div class="summary">

        <h2>Order Summary</h2>

        <div class="time-box" id="currentTime"></div>

        <div class="total" id="total">₱0</div>

        <form class="checkout" onsubmit="checkout(event)">

            <input id="name" placeholder="👤 Full Name" required>

            <input id="address" placeholder="📍 Delivery Address" required>

            <div class="payment-method">

                <h3>Payment Method</h3>

                <label>
                    <input type="radio" name="payment"
                    value="GCash"
                    onclick="togglePayment()" required>

                    📱 GCash
                </label>

                <label>
                    <input type="radio" name="payment"
                    value="Cash on Delivery"
                    onclick="togglePayment()">

                    💵 Cash on Delivery
                </label>

                <label>
                    <input type="radio" name="payment"
                    value="Bank Transfer"
                    onclick="togglePayment()">

                    🏦 Bank Transfer
                </label>

            </div>

            <!-- GCASH -->
            <div id="gcashBox" class="payment-box">

                <h3>📱 Scan to Pay</h3>

                <img src="gcash-qr.png">

                <p style="color:gray;">
                    Upload payment screenshot
                </p>

                <input type="file"
                id="paymentProof"
                accept="image/*">

                <img id="previewImg">

            </div>

            <!-- BANK TRANSFER -->
            <div id="bankBox" class="payment-box">

                <h3>🏦 Bank Transfer Details</h3>

                <select id="selectedBank">

                    <option value="">
                        Select Bank
                    </option>

                    <option value="BDO">
                        BDO Unibank
                    </option>

                    <option value="BPI">
                        BPI
                    </option>

                    <option value="Metrobank">
                        Metrobank
                    </option>

                    <option value="Landbank">
                        Landbank
                    </option>

                </select>

                <div class="bank-card">

                    <div class="bank-info">

                        <strong>Account Name:</strong>
                        Eloisa's Garden Shop

                        <br>

                        <strong>Account Number:</strong>
                        1234-5678-9012

                    </div>

                    <div class="bank-note">
                        Transfer your payment then upload
                        the receipt below.
                    </div>

                </div>

                <input type="text"
                id="senderAccount"
                placeholder="🏦 Your Account Number">

                <input type="file"
                id="bankProof"
                accept="image/*">

                <img id="bankPreview">

            </div>

            <button class="place-order" type="submit">
                🌿 Place Order
            </button>

        </form>

    </div>

</div>

<script>

let cart = JSON.parse(localStorage.getItem("cart")) || [];

let box = document.getElementById("cartBox");

function renderCart(){

    box.innerHTML = "";

    let total = 0;

    if(cart.length === 0){

        box.innerHTML = `
            <div class="empty">
                <h2>Your cart is empty 🌱</h2>
                <p>Add plants to continue shopping.</p>
            </div>
        `;

        document.getElementById("total")
        .innerHTML = "₱0";

        return;
    }

    cart.forEach((item,index)=>{

        let div = document.createElement("div");

        div.className = "item";

        div.innerHTML = `

            <div>

                <div class="item-name">
                    ${item.name}
                </div>

                <div class="item-price">
                    ₱${item.price} × ${item.qty}
                </div>

            </div>

            <div class="actions">

                <button class="minus"
                onclick="minus(${index})">-</button>

                <button class="plus"
                onclick="plus(${index})">+</button>

                <button class="remove"
                onclick="removeItem(${index})">
                Remove
                </button>

            </div>
        `;

        box.appendChild(div);

        total += item.price * item.qty;
    });

    document.getElementById("total")
    .innerHTML = "Total: ₱" + total;
}

function plus(i){

    cart[i].qty++;

    save();
}

function minus(i){

    cart[i].qty--;

    if(cart[i].qty < 1){

        cart[i].qty = 1;
    }

    save();
}

function removeItem(i){

    cart.splice(i,1);

    save();
}

function save(){

    localStorage.setItem(
        "cart",
        JSON.stringify(cart)
    );

    renderCart();
}

/* PAYMENT TOGGLE */
function togglePayment(){

    let selected =
    document.querySelector(
    'input[name="payment"]:checked'
    );

    let gcashBox =
    document.getElementById("gcashBox");

    let bankBox =
    document.getElementById("bankBox");

    gcashBox.style.display = "none";
    bankBox.style.display = "none";

    if(selected){

        if(selected.value === "GCash"){

            gcashBox.style.display = "block";
        }

        if(selected.value === "Bank Transfer"){

            bankBox.style.display = "block";
        }
    }
}

/* IMAGE PREVIEW */
document.getElementById("paymentProof")
.addEventListener("change",function(){

    previewImage(this,"previewImg");
});

document.getElementById("bankProof")
.addEventListener("change",function(){

    previewImage(this,"bankPreview");
});

function previewImage(input,id){

    let file = input.files[0];

    let preview =
    document.getElementById(id);

    if(file){

        let reader = new FileReader();

        reader.onload = function(e){

            preview.src = e.target.result;

            preview.style.display = "block";
        };

        reader.readAsDataURL(file);
    }
}

/* CHECKOUT */
function checkout(event){

    event.preventDefault();

    let name =
    document.getElementById("name")
    .value.trim();

    let address =
    document.getElementById("address")
    .value.trim();

    let payment =
    document.querySelector(
    'input[name="payment"]:checked'
    );

    let proof =
    document.getElementById("paymentProof")
    .files[0];

    let bankProof =
    document.getElementById("bankProof")
    .files[0];

    let selectedBank =
    document.getElementById("selectedBank")
    .value;

    let senderAccount =
    document.getElementById("senderAccount")
    .value.trim();

    if(name === "" || address === ""){

        alert("Please complete all details.");

        return;
    }

    if(!payment){

        alert("Select a payment method.");

        return;
    }

    if(payment.value === "GCash" && !proof){

        alert("Upload GCash payment screenshot.");

        return;
    }

    if(payment.value === "Bank Transfer"){

        if(selectedBank === ""){

            alert("Please select a bank.");

            return;
        }

        if(senderAccount === ""){

            alert("Enter your account number.");

            return;
        }

        if(!bankProof){

            alert("Upload bank transfer receipt.");

            return;
        }
    }

    function saveOrder(imageData){

        let now = new Date();

        let order = {

            name:name,
            address:address,
            payment:payment.value,

            bank:selectedBank,
            senderAccount:senderAccount,

            proofImage:imageData,

            cart:cart,

            date: now.toLocaleDateString(),

            time: now.toLocaleTimeString()
        };

        let orders =
        JSON.parse(
        localStorage.getItem("orders")
        ) || [];

        orders.push(order);

        localStorage.setItem(
        "orders",
        JSON.stringify(orders));

        localStorage.setItem(
        "orderData",
        JSON.stringify(order));

        localStorage.removeItem("cart");

        alert("Order placed successfully!");

        window.location.href =
        "confirmation.html";
    }

    /* GCASH */
    if(payment.value === "GCash"){

        let reader = new FileReader();

        reader.onload = function(e){

            saveOrder(e.target.result);
        };

        reader.readAsDataURL(proof);

        return;
    }

    /* BANK */
    if(payment.value === "Bank Transfer"){

        let reader = new FileReader();

        reader.onload = function(e){

            saveOrder(e.target.result);
        };

        reader.readAsDataURL(bankProof);

        return;
    }

    /* COD */
    saveOrder(null);
}

/* LIVE TIME */
function showCurrentTime(){

    let now = new Date();

    document.getElementById("currentTime")
    .innerHTML =
    "🕒 " + now.toLocaleString();
}

showCurrentTime();

setInterval(showCurrentTime,1000);

renderCart();

</script>

</body>
</html>
