<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Eloisa's Garden</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:linear-gradient(120deg,#2e7d32,#81c784);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

/* LOGIN BOX */
.login-box{
    background:white;
    padding:30px;
    border-radius:15px;
    width:320px;
    box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

.login-box h2{
    text-align:center;
    color:#2e7d32;
    margin-bottom:20px;
}

.login-box input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:10px;
    outline:none;
}

.login-box button{
    width:100%;
    padding:12px;
    background:#2e7d32;
    color:white;
    border:none;
    border-radius:10px;
    font-weight:bold;
    cursor:pointer;
    margin-top:10px;
    transition:0.3s;
}

.login-box button:hover{
    background:#1b5e20;
}

.note{
    font-size:12px;
    text-align:center;
    margin-top:10px;
    color:#555;
}
</style>
</head>

<body>

<div class="login-box">

    <h2>🌿 Login</h2>

    <input type="text" id="username" placeholder="Username">

    <input type="password" id="password" placeholder="Password">

    <button onclick="login()">Login</button>

    <div class="note">
        Use any username (demo system using localStorage)
    </div>

</div>

<script>

/* LOGIN FUNCTION */
function login(){

    let username = document.getElementById("username").value;
    let password = document.getElementById("password").value;

    if(username === "" || password === ""){
        alert("Please fill in all fields!");
        return;
    }

    /* GET USERS LIST */
    let users = JSON.parse(localStorage.getItem("users")) || [];

    /* FIND USER */
    let existingUser = users.find(u => u.username === username);

    /* IF USER EXISTS CHECK PASSWORD */
    if(existingUser){

        if(existingUser.password !== password){
            alert("Wrong password!");
            return;
        }

    } else {
        /* CREATE NEW USER */
        let newUser = {
            username: username,
            password: password
        };

        users.push(newUser);
        localStorage.setItem("users", JSON.stringify(users));
    }

    /* SET CURRENT LOGGED IN USER */
   localStorage.setItem("userAccount", JSON.stringify({
    username: username
}));

    alert("Login successful!");

    /* REDIRECT */
    window.location.href = "Indoor.html";
}

</script>

</body>
</html>
