<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:
    linear-gradient(135deg,#e8f5e9,#f1f8e9,#ffffff);
    min-height:100vh;
    padding:25px;
    color:#1b4332;
}

/* LOGIN */

#loginBox{
    width:100%;
    max-width:380px;
    margin:80px auto;
    background:rgba(255,255,255,0.9);
    backdrop-filter:blur(10px);
    padding:35px;
    border-radius:25px;
    box-shadow:0 10px 30px rgba(0,0,0,0.1);
    text-align:center;
    animation:fadeIn 0.6s ease;
}

#loginBox h2{
    font-size:32px;
    margin-bottom:10px;
    color:#2e7d32;
}

.login-sub{
    color:#666;
    margin-bottom:25px;
    font-size:14px;
}

#loginBox input{
    width:100%;
    padding:14px;
    border-radius:14px;
    border:1px solid #ddd;
    margin:12px 0;
    font-size:15px;
    transition:0.3s;
}

#loginBox input:focus{
    border-color:#43a047;
    outline:none;
    box-shadow:0 0 0 4px rgba(67,160,71,0.15);
}

.login-btn{
    width:100%;
    padding:14px;
    border:none;
    border-radius:14px;
    background:linear-gradient(90deg,#43a047,#2e7d32);
    color:white;
    font-size:16px;
    cursor:pointer;
    margin-top:10px;
    transition:0.3s;
}

.login-btn:hover{
    transform:translateY(-2px);
}

/* DASHBOARD */

#dashboard{
    display:none;
}

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:15px;
    margin-bottom:25px;
}

.topbar h1{
    font-size:38px;
    color:#1b4332;
}

.topbar p{
    color:#666;
    margin-top:5px;
}

/* STATS */

.stats-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    margin-bottom:25px;
}

.stat-card{
    background:white;
    border-radius:22px;
    padding:25px;
    box-shadow:0 8px 20px rgba(0,0,0,0.08);
    position:relative;
    overflow:hidden;
}

.stat-card::before{
    content:"";
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:6px;
    background:linear-gradient(90deg,#66bb6a,#2e7d32);
}

.stat-card h3{
    color:#666;
    font-size:15px;
    margin-bottom:12px;
}

.stat-card .value{
    font-size:34px;
    font-weight:700;
    color:#1b4332;
}

/* SEARCH BAR */

.search-box{
    background:white;
    padding:20px;
    border-radius:22px;
    margin-bottom:25px;
    box-shadow:0 8px 20px rgba(0,0,0,0.08);
    display:flex;
    flex-wrap:wrap;
    gap:10px;
}

.search-box input{
    flex:1;
    min-width:200px;
    padding:14px;
    border-radius:12px;
    border:1px solid #ddd;
    font-size:15px;
}

.search-box button{
    border:none;
    padding:14px 18px;
    border-radius:12px;
    cursor:pointer;
    color:white;
    font-weight:600;
    transition:0.3s;
}

.search-btn{
    background:#2e7d32;
}

.clear-btn{
    background:#757575;
}

.search-box button:hover{
    transform:translateY(-2px);
}

/* ORDERS */

#ordersBox{
    display:grid;
    gap:20px;
}

.order{
    background:white;
    border-radius:25px;
    padding:25px;
    box-shadow:0 10px 25px rgba(0,0,0,0.08);
    transition:0.3s;
    border:1px solid #edf2f4;
}

.order:hover{
    transform:translateY(-4px);
}

.order-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:18px;
}

.customer{
    display:flex;
    align-items:center;
    gap:15px;
}

.avatar{
    width:55px;
    height:55px;
    border-radius:50%;
    background:linear-gradient(135deg,#66bb6a,#2e7d32);
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:22px;
    font-weight:bold;
}

.customer h2{
    font-size:22px;
}

.customer p{
    color:#777;
    font-size:14px;
}

/* STATUS */

.status{
    padding:8px 16px;
    border-radius:30px;
    font-size:13px;
    font-weight:600;
}

.toShip{
    background:#fff3cd;
    color:#856404;
}

.toReceive{
    background:#cce5ff;
    color:#004085;
}

.completed{
    background:#d4edda;
    color:#155724;
}

/* INFO */

.order-info{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:15px;
    margin:18px 0;
}

.info-card{
    background:#f8fff8;
    border-radius:15px;
    padding:15px;
    border:1px solid #dcedc8;
}

.info-card h4{
    color:#777;
    font-size:13px;
    margin-bottom:8px;
}

.info-card p{
    font-weight:600;
    color:#1b4332;
}

/* ITEMS */

.items-box{
    margin-top:20px;
    padding:18px;
    background:#f9fff9;
    border-radius:18px;
}

.items-box h3{
    margin-bottom:12px;
}

.item{
    padding:10px 0;
    border-bottom:1px solid #eee;
    display:flex;
    justify-content:space-between;
}

.item:last-child{
    border-bottom:none;
}

/* TOTAL */

.total{
    margin-top:18px;
    font-size:24px;
    font-weight:700;
    color:#2e7d32;
}

/* ACTIONS */

.actions{
    margin-top:20px;
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    align-items:center;
}

select{
    padding:12px;
    border-radius:12px;
    border:1px solid #ccc;
    font-size:14px;
    cursor:pointer;
}

.delete-btn{
    background:#e53935;
    color:white;
    border:none;
    padding:12px 18px;
    border-radius:12px;
    cursor:pointer;
    font-weight:600;
    transition:0.3s;
}

.delete-btn:hover{
    transform:translateY(-2px);
}

/* PAYMENT IMAGE */

.receipt{
    margin-top:15px;
}

.receipt img{
    width:220px;
    border-radius:16px;
    border:3px solid #f1f1f1;
}

/* EMPTY */

.empty{
    background:white;
    padding:50px;
    border-radius:25px;
    text-align:center;
    color:#777;
    box-shadow:0 8px 20px rgba(0,0,0,0.08);
}

/* ANIMATION */

@keyframes fadeIn{

    from{
        opacity:0;
        transform:translateY(15px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* MOBILE */

@media(max-width:768px){

    body{
        padding:15px;
    }

    .topbar h1{
        font-size:30px;
    }

    .order{
        padding:18px;
    }

    .customer h2{
        font-size:18px;
    }
}

</style>
</head>

<body>

<!-- LOGIN -->

<div id="loginBox">

    <h2>🌿 Admin Panel</h2>

    <p class="login-sub">
        Login to manage orders and customers
    </p>

    <input type="text"
    id="adminEmail"
    placeholder="👤 Username">

    <input type="password"
    id="adminPass"
    placeholder="🔒 Password">

    <button class="login-btn"
    onclick="login()">
        Login Dashboard
    </button>

</div>

<!-- DASHBOARD -->

<div id="dashboard">

    <div class="topbar">

        <div>
            <h1>📊 Dashboard</h1>
            <p>Manage all customer orders in real-time</p>
        </div>

    </div>

    <!-- STATS -->

    <div class="stats-grid">

        <div class="stat-card">
            <h3>Total Orders</h3>
            <div class="value" id="totalOrders">
                0
            </div>
        </div>

        <div class="stat-card">
            <h3>Total Sales</h3>
            <div class="value" id="totalSales">
                ₱0
            </div>
        </div>

        <div class="stat-card">
            <h3>Completed</h3>
            <div class="value" id="completedOrders">
                0
            </div>
        </div>

    </div>

    <!-- SEARCH -->

    <div class="search-box">

        <input type="text"
        id="searchInput"
        placeholder="🔍 Search customer name...">

        <button class="search-btn"
        onclick="renderOrders()">
            Search
        </button>

        <button class="clear-btn"
        onclick="clearSearch()">
            Clear
        </button>

    </div>

    <!-- ORDERS -->

    <div id="ordersBox"></div>

</div>

<script>

/* LOGIN */

function login(){

    let email =
    document.getElementById("adminEmail").value;

    let pass =
    document.getElementById("adminPass").value;

    if(email === "paul" && pass === "paul"){

        document.getElementById("loginBox")
        .style.display = "none";

        document.getElementById("dashboard")
        .style.display = "block";

        renderOrders();

    }else{

        alert("Invalid login!");
    }
}

/* GET ALL ORDERS */

function getAllOrders(){

    let all = [];

    for(let key in localStorage){

        if(key.startsWith("orders")){

            let data =
            JSON.parse(localStorage.getItem(key)) || [];

            data.forEach(o=>{

                o._key = key;

                all.push(o);
            });
        }
    }

    return all;
}

/* SAVE */

function saveAll(all){

    let grouped = {};

    all.forEach(o=>{

        if(!grouped[o._key]){

            grouped[o._key] = [];
        }

        grouped[o._key].push(o);
    });

    for(let key in grouped){

        localStorage.setItem(
            key,
            JSON.stringify(grouped[key])
        );
    }
}

let orders = [];

let box =
document.getElementById("ordersBox");

/* RENDER */

function renderOrders(){

    orders = getAllOrders();

    let search =
    document.getElementById("searchInput")
    .value.toLowerCase();

    box.innerHTML = "";

    let totalSales = 0;
    let totalOrders = 0;
    let completed = 0;

    orders.forEach((order,index)=>{

        if(
            order.name &&
            !order.name.toLowerCase()
            .includes(search)
        ) return;

        totalOrders++;

        let total = 0;

        let itemsHTML = "";

        order.cart.forEach(i=>{

            total += i.price * i.qty;

            itemsHTML += `
                <div class="item">

                    <span>
                        🌿 ${i.name}
                    </span>

                    <span>
                        ₱${i.price} × ${i.qty}
                    </span>

                </div>
            `;
        });

        totalSales += total;

        let status =
        order.status || "To Ship";

        if(status === "Completed"){

            completed++;
        }

        let cls = "";

        if(status === "To Ship"){

            cls = "toShip";
        }

        if(status === "To Receive"){

            cls = "toReceive";
        }

        if(status === "Completed"){

            cls = "completed";
        }

        box.innerHTML += `

            <div class="order">

                <div class="order-top">

                    <div class="customer">

                        <div class="avatar">
                            ${order.name
                            ? order.name.charAt(0)
                            : "U"}
                        </div>

                        <div>

                            <h2>
                                ${order.name || "Unknown"}
                            </h2>

                            <p>
                                ${order.address || "No address"}
                            </p>

                        </div>

                    </div>

                    <span class="status ${cls}">
                        ${status}
                    </span>

                </div>

                <div class="order-info">

                    <div class="info-card">
                        <h4>Payment Method</h4>
                        <p>
                            ${order.payment || "N/A"}
                        </p>
                    </div>

                    <div class="info-card">
                        <h4>Order Date</h4>
                        <p>
                            ${order.date || "N/A"}
                        </p>
                    </div>

                    <div class="info-card">
                        <h4>Order Time</h4>
                        <p>
                            ${order.time || "N/A"}
                        </p>
                    </div>

                </div>

                <div class="items-box">

                    <h3>🛒 Ordered Items</h3>

                    ${itemsHTML}

                </div>

                ${
                    order.proofImage
                    ?
                    `
                    <div class="receipt">

                        <h3 style="margin-bottom:10px;">
                            📷 Payment Receipt
                        </h3>

                        <img src="${order.proofImage}">

                    </div>
                    `
                    :
                    ""
                }

                <div class="total">
                    💰 Total: ₱${total}
                </div>

                <div class="actions">

                    <select onchange="updateStatus(${index},this.value)">

                        <option
                        ${status==="To Ship"?"selected":""}>
                        To Ship
                        </option>

                        <option
                        ${status==="To Receive"?"selected":""}>
                        To Receive
                        </option>

                        <option
                        ${status==="Completed"?"selected":""}>
                        Completed
                        </option>

                    </select>

                    <button class="delete-btn"
                    onclick="deleteOrder(${index})">
                        Delete Order
                    </button>

                </div>

            </div>
        `;
    });

    if(totalOrders === 0){

        box.innerHTML = `
            <div class="empty">

                <h2>
                    No orders found 🌱
                </h2>

                <p>
                    Customer orders will appear here.
                </p>

            </div>
        `;
    }

    document.getElementById("totalOrders")
    .innerHTML = totalOrders;

    document.getElementById("totalSales")
    .innerHTML = "₱" + totalSales;

    document.getElementById("completedOrders")
    .innerHTML = completed;
}

/* UPDATE STATUS */

function updateStatus(index,status){

    orders = getAllOrders();

    orders[index].status = status;

    saveAll(orders);

    renderOrders();
}

/* DELETE */

function deleteOrder(index){

    let confirmDelete =
    confirm("Delete this order?");

    if(!confirmDelete) return;

    orders = getAllOrders();

    orders.splice(index,1);

    saveAll(orders);

    renderOrders();
}

/* CLEAR SEARCH */

function clearSearch(){

    document.getElementById("searchInput")
    .value = "";

    renderOrders();
}

</script>

</body>
</html>
