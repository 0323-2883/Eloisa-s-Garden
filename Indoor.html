<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Indoor Plants</title>

<!-- GOOGLE FONT -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
    text-decoration:none;
}

/* BODY */
body{
    background:url("Indoorbg.jpg") no-repeat center center/cover;
    min-height:100vh;
    overflow-x:hidden;
}

/* LIGHTER OVERLAY */
body::before{
    content:'';
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:linear-gradient(
        rgba(255,255,255,0.08),
        rgba(0,0,0,0.18)
    );
    z-index:-1;
}

/* NAVBAR */
.navbar{
    width:100%;
    padding:18px 8%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    position:sticky;
    top:0;
    z-index:1000;
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    background:rgba(46,125,50,0.45);
    border-bottom:1px solid rgba(255,255,255,0.25);
    box-shadow:0 4px 15px rgba(0,0,0,0.12);
    flex-wrap:wrap;
}

/* LOGO */
.logo{
    display:flex;
    align-items:center;
    gap:10px;
    color:white;
    font-size:30px;
    font-weight:700;
    text-shadow:0 2px 8px rgba(0,0,0,0.25);
}

/* NAV LINKS */
.nav-links{
    list-style:none;
    display:flex;
    align-items:center;
    gap:15px;
    flex-wrap:wrap;
}

.nav-links li{
    position:relative;
}

.nav-links a{
    color:white;
    font-size:16px;
    font-weight:500;
    padding:10px 16px;
    border-radius:30px;
    transition:0.3s ease;
    display:block;
}

.nav-links a:hover{
    background:white;
    color:#2e7d32;
    transform:translateY(-2px);
}

/* ACTIVE PAGE */
.nav-links a.active{
    background:white;
    color:#2e7d32;
    font-weight:600;
    box-shadow:0 4px 12px rgba(255,255,255,0.25);
}

/* DROPDOWN */
.dropdown-content{
    position:absolute;
    top:50px;
    left:0;
    background:white;
    min-width:230px;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 8px 20px rgba(0,0,0,0.18);
    opacity:0;
    visibility:hidden;
    transform:translateY(10px);
    transition:0.3s;
}

.dropdown-content a{
    display:block;
    color:#2e7d32;
    padding:14px 18px;
    border-radius:0;
}

.dropdown-content a:hover{
    background:#e8f5e9;
    color:#1b5e20;
}

.dropdown:hover .dropdown-content{
    opacity:1;
    visibility:visible;
    transform:translateY(0);
}

/* CART COUNT */
#cartCount{
    background:#ff5252;
    color:white;
    font-size:11px;
    padding:3px 7px;
    border-radius:50%;
    margin-left:5px;
}

/* AUTH BUTTONS */
.auth-buttons{
    display:flex;
    align-items:center;
}

.auth-buttons button{
    background:rgba(255,255,255,0.92);
    color:#2e7d32;
    border:none;
    padding:10px 18px;
    border-radius:30px;
    margin-left:10px;
    font-weight:600;
    cursor:pointer;
    transition:0.3s;
    backdrop-filter:blur(5px);
}

.auth-buttons button:hover{
    background:white;
    transform:translateY(-2px);
}

/* ACCOUNT INFO */
.account-info{
    display:flex;
    align-items:center;
    gap:10px;
    background:rgba(255,255,255,0.92);
    color:#2e7d32;
    padding:10px 18px;
    border-radius:30px;
    font-weight:600;
    backdrop-filter:blur(5px);
}

/* LOGOUT BUTTON */
.logout-btn{
    background:#e53935;
    color:white;
    border:none;
    padding:8px 14px;
    border-radius:20px;
    cursor:pointer;
    transition:0.3s;
}

.logout-btn:hover{
    background:#c62828;
    transform:scale(1.05);
}

/* CONTAINER */
.container{
    max-width:1200px;
    margin:auto;
    padding:40px 30px;
}

/* TITLE */
h3{
    text-align:center;
    color:white;
    font-size:55px;
    margin-bottom:10px;
    text-shadow:0 5px 10px rgba(0,0,0,0.25);
}

.subtitle{
    text-align:center;
    color:#ffffff;
    margin-bottom:35px;
    font-size:20px;
    text-shadow:0 2px 8px rgba(0,0,0,0.2);
}

/* SEARCH */
.search-box{
    text-align:center;
    margin-bottom:35px;
}

.search-box input{
    width:50%;
    padding:14px 18px;
    border-radius:40px;
    border:none;
    outline:none;
    font-size:16px;
    background:rgba(255,255,255,0.92);
    backdrop-filter:blur(8px);
    box-shadow:0 5px 15px rgba(0,0,0,0.08);
}

.search-box button{
    padding:14px 22px;
    border:none;
    border-radius:40px;
    background:#43a047;
    color:white;
    cursor:pointer;
    font-size:16px;
    font-weight:600;
    transition:0.3s;
    box-shadow:0 5px 15px rgba(67,160,71,0.3);
}

.search-box button:hover{
    background:#2e7d32;
    transform:scale(1.05);
}

/* CARDS */
.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:25px;
}

.card{
    background:rgba(255,255,255,0.92);
    border-radius:22px;
    padding:15px;
    text-align:center;
    box-shadow:0 8px 20px rgba(0,0,0,0.12);
    backdrop-filter:blur(8px);
    transition:0.4s;
}

.card:hover{
    transform:translateY(-10px);
    box-shadow:0 12px 25px rgba(0,0,0,0.16);
}

.card img{
    width:100%;
    height:220px;
    object-fit:cover;
    border-radius:18px;
}

.card h2{
    color:#2e7d32;
    margin:14px 0;
    font-size:22px;
}

.price{
    font-size:22px;
    font-weight:bold;
    color:#1b5e20;
}

.card button{
    margin-top:12px;
    padding:11px 18px;
    background:#43a047;
    color:white;
    border:none;
    border-radius:12px;
    cursor:pointer;
    transition:0.3s;
    font-weight:600;
    box-shadow:0 4px 12px rgba(67,160,71,0.25);
}

.card button:hover{
    background:#2e7d32;
    transform:scale(1.05);
}

/* CHECKOUT BUTTON */
.checkout-container{
    text-align:center;
    margin-top:45px;
}

.checkout-btn{
    display:inline-block;
    background:#ff9800;
    color:white;
    padding:15px 30px;
    border-radius:15px;
    font-size:20px;
    font-weight:bold;
    transition:0.3s;
    box-shadow:0 5px 15px rgba(255,152,0,0.3);
}

.checkout-btn:hover{
    background:#e68900;
    transform:scale(1.05);
}

/* TOAST */
#toast{
    visibility:hidden;
    min-width:220px;
    background:#2e7d32;
    color:white;
    text-align:center;
    border-radius:10px;
    padding:14px;
    position:fixed;
    right:20px;
    bottom:80px;
    z-index:1000;
    opacity:0;
    transition:0.4s;
    box-shadow:0 5px 15px rgba(0,0,0,0.2);
}

#toast.show{
    visibility:visible;
    opacity:1;
    bottom:100px;
}

/* MODAL */
.modal{
    display:none;
    position:fixed;
    z-index:2000;
    left:0;
    top:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.45);
    backdrop-filter:blur(4px);
}

.modal-content{
    background:rgba(255,255,255,0.96);
    width:350px;
    margin:8% auto;
    padding:30px;
    border-radius:22px;
    text-align:center;
    position:relative;
    animation:fadeIn 0.4s ease;
    box-shadow:0 10px 30px rgba(0,0,0,0.18);
}

.modal-content h2{
    color:#2e7d32;
    margin-bottom:20px;
}

.modal-content input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:1px solid #dcdcdc;
    border-radius:12px;
    outline:none;
}

.modal-content button{
    width:100%;
    padding:12px;
    background:#43a047;
    color:white;
    border:none;
    border-radius:12px;
    font-size:16px;
    cursor:pointer;
    margin-top:10px;
    transition:0.3s;
}

.modal-content button:hover{
    background:#2e7d32;
}

.close{
    position:absolute;
    right:15px;
    top:10px;
    font-size:24px;
    cursor:pointer;
    color:red;
}

/* ANIMATION */
@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(20px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* =========================
   MOBILE RESPONSIVE DESIGN
========================= */

@media(max-width:900px){

    .navbar{
        flex-direction:column;
        gap:18px;
        padding:18px 5%;
    }

    .logo{
        font-size:25px;
        text-align:center;
    }

    .nav-links{
        justify-content:center;
        gap:10px;
    }

    .nav-links a{
        font-size:14px;
        padding:10px 14px;
    }

    .auth-buttons{
        width:100%;
        justify-content:center;
        flex-wrap:wrap;
        gap:10px;
    }

    .auth-buttons button{
        margin-left:0;
    }

    .account-info{
        flex-wrap:wrap;
        justify-content:center;
    }

    h3{
        font-size:42px;
    }

    .subtitle{
        font-size:18px;
        padding:0 10px;
    }

    .search-box{
        display:flex;
        flex-direction:column;
        align-items:center;
        gap:12px;
    }

    .search-box input{
        width:100%;
        max-width:500px;
    }

    .search-box button{
        width:100%;
        max-width:220px;
    }

    .cards{
        grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
    }

    .card img{
        height:230px;
    }
}

@media(max-width:768px){

    body{
        overflow-x:hidden;
    }

    .navbar{
        padding:16px 4%;
    }

    .nav-links{
        width:100%;
        flex-direction:column;
        align-items:center;
    }

    .nav-links li{
        width:100%;
    }

    .nav-links a{
        width:100%;
        text-align:center;
    }

    .dropdown-content{
        position:static;
        opacity:1;
        visibility:visible;
        transform:none;
        display:none;
        width:100%;
        margin-top:8px;
        border-radius:15px;
    }

    .dropdown:hover .dropdown-content{
        display:block;
    }

    .container{
        padding:30px 15px;
    }

    h3{
        font-size:35px;
        line-height:1.2;
    }

    .subtitle{
        font-size:16px;
        line-height:1.6;
    }

    .search-box input{
        width:100%;
        font-size:15px;
    }

    .search-box button{
        width:100%;
    }

    .cards{
        grid-template-columns:1fr;
        gap:20px;
    }

    .card{
        padding:14px;
    }

    .card h2{
        font-size:20px;
    }

    .price{
        font-size:20px;
    }

    .card button{
        width:100%;
    }

    .checkout-btn{
        width:100%;
        max-width:320px;
        text-align:center;
        font-size:18px;
    }

    .modal-content{
        width:92%;
        margin:25% auto;
        padding:25px;
    }

    #toast{
        right:10px;
        left:10px;
        bottom:30px;
        min-width:auto;
    }
}

@media(max-width:480px){

    .logo{
        font-size:21px;
    }

    h3{
        font-size:30px;
    }

    .subtitle{
        font-size:15px;
    }

    .card img{
        height:200px;
    }

    .checkout-btn{
        padding:14px 20px;
        font-size:16px;
    }

    .modal-content h2{
        font-size:24px;
    }
}

</style>
</head>
