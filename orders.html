<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Orders</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins', Arial, sans-serif;
    text-decoration:none;
}

body{
    background:#f5f5f5;
}

/* NAVBAR */
.navbar{
    width:100%;
    padding:18px 8%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    position:sticky;
    top:0;
    z-index:1000;
    backdrop-filter:blur(10px);
    background:rgba(20,50,20,0.75);
    border-bottom:1px solid rgba(255,255,255,0.2);
}

.logo{
    font-size:30px;
    font-weight:700;
    color:white;
}

.nav-links{
    list-style:none;
    display:flex;
    gap:15px;
    align-items:center;
    flex-wrap:wrap;
}

.nav-links a{
    color:white;
    font-size:16px;
    font-weight:500;
    padding:10px 16px;
    border-radius:30px;
    transition:0.3s;
}

.nav-links a:hover{
    background:white;
    color:#2e7d32;
}

/* ACTIVE */
.nav-links a.active{
    background:white;
    color:#2e7d32;
}

/* PAGE */
.container{
    max-width:1100px;
    margin:auto;
    padding:25px;
}

h1{
    text-align:center;
    color:#2e7d32;
    margin-bottom:20px;
}

/* TABS */
.tabs{
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:20px;
}

.tab{
    padding:10px 16px;
    border:none;
    border-radius:20px;
    cursor:pointer;
    background:#e0e0e0;
    font-weight:bold;
}

.tab.active{
    background:#2e7d32;
    color:white;
}

/* ORDER CARD */
.order-card{
    background:white;
    padding:15px;
    border-radius:12px;
    margin-bottom:12px;
    box-shadow:0 4px 10px rgba(0,0,0,0.08);
}

.status{
    font-weight:bold;
    padding:5px 10px;
    border-radius:8px;
    display:inline-block;
}

/* STATUS COLORS */
.toShip{ background:#fff3cd; color:#856404; }
.toReceive{ background:#cce5ff; color:#004085; }
.completed{ background:#d4edda; color:#155724; }

ul{
    margin-left:20px;
}
</style>
</head>

<body>

<div class="navbar">

    <div class="logo">🌿 Eloisa's Garden</div>

    <ul class="nav-links">
        <li><a href="dropdown.html">Home</a></li>
        <li><a href="Indoor.html">Indoor Plants</a></li>
        <li><a href="outdoor.html">Outdoor Plants</a></li>
        <li><a href="profile.html">Profile</a></li>
        <li><a class="active" href="myorders.html">My Orders</a></li>
    </ul>

</div>

<div class="container">

    <h1>📦 My Orders</h1>

    <div class="tabs">
        <button class="tab active" onclick="filterOrders('All',event)">All</button>
        <button class="tab" onclick="filterOrders('To Ship',event)">To Ship</button>
        <button class="tab" onclick="filterOrders('To Receive',event)">To Receive</button>
        <button class="tab" onclick="filterOrders('Completed',event)">Delivered</button>
    </div>

    <div id="ordersContainer"></div>

</div>

<script>

let user = JSON.parse(localStorage.getItem("userAccount"));

if(!user){
    alert("Please login first");
    window.location.href = "dropdown.html";
}

let orderKey = "orders_" + user.username;

function getOrders(){
    return JSON.parse(localStorage.getItem(orderKey)) || [];
}

let currentFilter = "All";

/* MAIN RENDER */
function renderOrders(){

    let orders = getOrders();
    let container = document.getElementById("ordersContainer");

    container.innerHTML = "";

    let filtered = orders.filter(o=>{
        if(currentFilter === "All") return true;
        return (o.status || "To Ship") === currentFilter;
    });

    if(filtered.length === 0){
        container.innerHTML = "<p style='text-align:center;'>No orders found.</p>";
        return;
    }

    filtered.forEach(order=>{

        let total = 0;
        let items = "";

        order.cart.forEach(i=>{
            total += i.price * i.qty;
            items += `<li>${i.name} - ₱${i.price} x ${i.qty}</li>`;
        });

        let status = order.status || "To Ship";

        let cls = "";
        if(status === "To Ship") cls = "toShip";
        if(status === "To Receive") cls = "toReceive";
        if(status === "Completed") cls = "completed";

        let div = document.createElement("div");
        div.className = "order-card";

        div.innerHTML = `
            <p><b>Status:</b> 
                <span class="status ${cls}">${status}</span>
            </p>

            <p><b>Date:</b> ${order.date || "N/A"} ${order.time || ""}</p>

            <p><b>Total:</b> ₱${total}</p>

            <p><b>Items:</b></p>
            <ul>${items}</ul>
        `;

        container.appendChild(div);
    });
}

/* FILTER */
function filterOrders(type, event){

    currentFilter = type;

    document.querySelectorAll(".tab").forEach(t=>{
        t.classList.remove("active");
    });

    event.target.classList.add("active");

    renderOrders();
}

renderOrders();

</script>

</body>
</html>
